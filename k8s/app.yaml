apiVersion: v1
kind: Service
metadata:
  labels:
    app: costcompass
  name: costcompass
  namespace: costcompass
spec:
  ports:
  - name: 3000-3000
    port: 3000
    protocol: TCP
    targetPort: 3000
  selector:
    app: costcompass
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: costcompass
  name: costcompass
  namespace: costcompass
spec:
  replicas: 1
  selector:
    matchLabels:
      app: costcompass
  strategy: {}
  template:
    metadata:
      labels:
        app: costcompass
    spec:
      containers:
      - image: costcompass:IMAGE_TAG
        name: costcompass
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          readOnlyRootFilesystem: true
        imagePullPolicy: IfNotPresent
        envFrom:
          - configMapRef:
              name: costcompass-config
        env:
          - name: NUXT_DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: costcompass-db
                key: NUXT_DATABASE_URL
        readinessProbe:
          httpGet:
            path: /api/ready
            port: 3000
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
