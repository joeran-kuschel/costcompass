apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: costcompass
  namespace: costcompass
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - costcompass.local
      secretName: costcompass-tls
  rules:
  - host: costcompass.local
    http:
      paths:
      - backend:
          service:
            name: costcompass
            port:
              number: 3000
        path: /
        pathType: Prefix
