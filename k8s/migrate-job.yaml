apiVersion: batch/v1
kind: Job
metadata:
  name: costcompass-migrate
  namespace: costcompass
spec:
  backoffLimit: 3
  template:
    spec:
      initContainers:
      - name: wait-for-postgres
        image: postgres:17
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do sleep 2; done"]
      containers:
      - image: costcompass-migrate:0.1.0
        name: costcompass-migrate
        imagePullPolicy: IfNotPresent
        env:
        - name: NUXT_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: costcompass-db
              key: NUXT_DATABASE_URL
      restartPolicy: Never
